networks:
  core_network:
    external: true
    name: ${EXTERNAL_NETWORK:-core_dev_network}

volumes:
  taskview_data:
    name: ${PROJECT_NAME:-core}_taskview_data

services:
  # -----------------------------------------------------------
  # Taskview Community
  # -----------------------------------------------------------
  taskview:
    image: gimanh/taskview-community:latest
    container_name: core_taskview
    restart: always
    ports:
      - "${TASKVIEW_PORT:-3080}:3000"
    volumes:
      - taskview_data:/app/data
    networks:
      - core_network
