# -----------------------------------------------------------
# Identificación del Proyecto (Ajustar por proyecto)
# -----------------------------------------------------------
sonar.projectKey=nombre-del-proyecto
sonar.projectName=nombre-del-proyecto
sonar.projectVersion=1.0

# -----------------------------------------------------------
# Conexión al servidor SonarQube
# -----------------------------------------------------------
# Apunta al contenedor SonarQube dentro de core_dev_network
sonar.host.url=http://core_sonarqube:9000
# Token generado en SonarQube (se puede sobreescribir por variable de entorno SONAR_TOKEN)
sonar.token=tu_token_aqui

# -----------------------------------------------------------
# Configuración de Archivos y Tests
# -----------------------------------------------------------
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/__mocks__/**,**/__stubs__/**,node_modules/**,dist/**,coverage/**

# -----------------------------------------------------------
# Reporte de Cobertura (LCOV generado por Vitest/Jest)
# -----------------------------------------------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# -----------------------------------------------------------
# Lenguaje y Codificación
# -----------------------------------------------------------
sonar.sourceEncoding=UTF-8