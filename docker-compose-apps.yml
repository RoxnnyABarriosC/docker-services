
networks:
  core_network:
    external: true
    name: ${EXTERNAL_NETWORK:-core_dev_network}

volumes:
  n8n_data:
    name: ${PROJECT_NAME:-core}_n8n_data

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: core_n8n
    restart: always
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/Caracas
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - core_network