
networks:
  core_network:
    external: true
    name: ${EXTERNAL_NETWORK:-core_dev_network}

volumes:
  postgres_data:
    name: ${PROJECT_NAME:-core}_postgres_data
  mongo_data:
    name: ${PROJECT_NAME:-core}_mongo_data
  mongo_config:
    name: ${PROJECT_NAME:-core}_mongo_config
  redis_data:
    name: ${PROJECT_NAME:-core}_redis_data

services:
  # -----------------------------------------------------------
  # 1. PostgreSQL (Multi-DB + Extensiones)
  # -----------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: core_postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-default_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pgsql/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - core_network

  # -----------------------------------------------------------
  # 2. MongoDB (Replica Set para Transacciones)
  # -----------------------------------------------------------
  mongo:
    image: mongo:latest
    container_name: core_mongo
    restart: always
    entrypoint:
      - /bin/bash
      - -c
      - >
        if [ ! -f /data/configdb/keyfile ]; then
          openssl rand -base64 756 > /data/configdb/keyfile &&
          chmod 400 /data/configdb/keyfile &&
          chown mongodb:mongodb /data/configdb/keyfile;
        fi;
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/configdb/keyfile
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - core_network

  mongo_setup:
    image: mongo:latest
    container_name: core_mongo_setup
    depends_on:
      - mongo
    restart: "no"
    networks:
      - core_network
    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    entrypoint: >
      /bin/sh -c "
      until mongosh --host mongo:27017 -u ${MONGO_USER:-admin} -p ${MONGO_PASSWORD:-admin123} --authenticationDatabase admin --eval \"db.adminCommand('ping')\" >/dev/null 2>&1; do
        sleep 2;
      done;
      mongosh --host mongo:27017 -u ${MONGO_USER:-admin} -p ${MONGO_PASSWORD:-admin123} --authenticationDatabase admin --eval '
        try {
          rs.status();
        } catch (e) {
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongo:27017\" }]
          });
        }
      ';
      exit 0;
      "

  # -----------------------------------------------------------
  # 3. Redis (Persistencia AOF + Contraseña)
  # -----------------------------------------------------------
  redis:
    image: redis:latest
    container_name: core_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-admin123}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - core_network
