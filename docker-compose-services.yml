
networks:
  core_network:
    name: ${EXTERNAL_NETWORK:-core_dev_network}
    driver: bridge

volumes:
  postgres_data:
    name: ${PROJECT_NAME:-core}_postgres_data
  mongo_data:
    name: ${PROJECT_NAME:-core}_mongo_data
  mongo_config:
    name: ${PROJECT_NAME:-core}_mongo_config
  redis_data:
    name: ${PROJECT_NAME:-core}_redis_data
  minio_data:
    name: ${PROJECT_NAME:-core}_minio_data

services:
  # -----------------------------------------------------------
  # 1. PostgreSQL (Multi-DB + Extensiones)
  # -----------------------------------------------------------
  postgres:
    image: postgres:latest
    container_name: core_postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-default_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pgsql/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - core_network

  # -----------------------------------------------------------
  # 2. MongoDB (Replica Set para Transacciones)
  # -----------------------------------------------------------
  mongo:
    image: mongo:latest
    container_name: core_mongo
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - core_network

  mongo_setup:
    image: mongo:latest
    container_name: core_mongo_setup
    depends_on:
      - mongo
    restart: "no"
    networks:
      - core_network
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mongosh --host mongo:27017 -u ${MONGO_USER:-admin} -p ${MONGO_PASSWORD:-admin123} --authenticationDatabase admin --eval '
        try {
          rs.status();
        } catch (e) {
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongo:27017\" }]
          });
        }
      ';
      exit 0;
      "

  # -----------------------------------------------------------
  # 3. Redis (Persistencia AOF + Contraseña)
  # -----------------------------------------------------------
  redis:
    image: redis:latest
    container_name: core_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-admin123}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - core_network

  # -----------------------------------------------------------
  # 4. MinIO (S3 Storage) + Inicializador de Buckets
  # -----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: core_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"       # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Consola Web
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - core_network

  minio_create_buckets:
    image: minio/mc:latest
    container_name: core_minio_buckets
    depends_on:
      - minio
    restart: "no"
    networks:
      - core_network
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set localminio http://minio:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASSWORD:-minioadmin123};
      /usr/bin/mc mb --ignore-existing localminio/public-bucket;
      /usr/bin/mc mb --ignore-existing localminio/private-bucket;
      /usr/bin/mc anonymous set download localminio/public-bucket;
      exit 0;
      "